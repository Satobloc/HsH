<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" role="img" aria-labelledby="title desc">
<title id="title">SO(4) channel activation across recursive Hagalaz lift orders</title>
<desc id="desc">Normalized RMS channel activity for six coordinate-plane rotation channels. The first transition has only xw, yw, zw active; later recursive transitions activate all six channels.</desc>
