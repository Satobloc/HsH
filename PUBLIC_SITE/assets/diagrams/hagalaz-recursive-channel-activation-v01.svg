<g font-family="Arial,Helvetica,sans-serif" fill="#111">
<text x="470" y="42" text-anchor="middle" font-size="24" font-weight="700">Class P — SO(4) channel activation across recursive orders</text>
<text x="470" y="70" text-anchor="middle" font-size="15">RMF gauge · μ=1 control · RMS normalized within each adjacent-order pair</text>
</g>
