# id = "example-excerpt"
# title = "Example developmental excerpt"
# source_path = "path/to/large-log.txt"
# date = "2025"
# phase = "SAT"
# categories = ["development"]
# selection = "candidate"
# render = "verbatim"
# note = "Example only; replace with a real selection."
