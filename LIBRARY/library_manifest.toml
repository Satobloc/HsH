# H(s)H public-library selection manifest
#
# This file is the handoff surface between archive discovery/tagging and the
# public presentation layer. It does NOT modify or supersede the historical
# SAT archive. Add candidates here as they are discovered; the generator in
# tools/build_public_library.py turns accepted entries into navigation/pages.
#
# selection = "showcase"  -> highlighted, formatted public-library item
# selection = "excerpt"   -> highlighted selected line range(s) from a source
# selection = "raw_pick"  -> useful direct link in the raw-development section
# selection = "candidate" -> tagged for review; not exposed publicly yet
#
# render = "verbatim" preserves source text after newline normalization.
# render = "manual" points to a separately curated presentation page while
# leaving the historical source untouched.

[settings]
source_repo = "Satobloc/SAT_THEORY_ARCHIVE_2023-25"
source_branch = "main"
generated_dir = "LIBRARY/generated"

[[documents]]
id = "fundamental-intuitions"
title = "The Fundamental Intuitions of SAT"
source_path = "DEV CONVERSATION/FUNDAMENTAL INTUITIONS.txt"
date = "2025"
phase = "Early SAT / public foundational statement"
categories = ["start-here", "foundations", "geometry", "method"]
selection = "showcase"
render = "manual"
presentation_path = "presented/fundamental-intuitions.md"
note = "A compact statement of the early SAT construction: worldlines as filaments, a moving time surface, particle-as-intersection, and the explicit rule to preserve successful Standard Model, GR, and QM structure unless forced otherwise. Historical wording is retained; some mechanisms were later revised."

