name: Publish paper and addendum index
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'PUBLIC_SITE/PAPERS/**'
      - 'SAT_VISUALS/**'
      - 'tools/publish_papers.py'
      - '.github/workflows/publish-paper-series.yml'
  schedule:
    - cron: '7 * * * *'
permissions:
  contents: write
concurrency:
  group: public-paper-series
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'pypdf>=5,<7'
      - name: Validate complete PDFs and publish ordered follow-ups
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git pull --ff-only origin main
            python tools/publish_papers.py
            git add PUBLIC_SITE/generated/papers.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish paper and ordered addendum index'
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git reset --hard origin/main
          done
          exit 1
