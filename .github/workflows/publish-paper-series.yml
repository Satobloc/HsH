name: Publish paper and addendum index
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'PUBLIC_SITE/PAPERS/**'
      - 'SAT_VISUALS/**'
      - 'tools/publish_papers.py'
      - 'tools/compile_paper_tex.py'
      - '.github/workflows/publish-paper-series.yml'
  schedule:
    - cron: '7 * * * *'
permissions:
  contents: write
concurrency:
  group: public-paper-series
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Extract compendium source packets
        if: github.event_name != 'schedule'
        run: |
          if [ -f PUBLIC_SITE/PAPERS/_build/compendium_seed.tar.gz ]; then
            tar -xzf PUBLIC_SITE/PAPERS/_build/compendium_seed.tar.gz -C .
            rm -f PUBLIC_SITE/PAPERS/_build/compendium_seed.tar.gz
            rmdir PUBLIC_SITE/PAPERS/_build 2>/dev/null || true
          fi
      - name: Install LaTeX toolchain
        if: github.event_name != 'schedule'
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'pypdf>=5,<7'
      - name: Validate complete PDFs and publish ordered follow-ups
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git pull --ff-only origin main
            if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
              python tools/compile_paper_tex.py
            fi
            python tools/publish_papers.py
            git add PUBLIC_SITE/PAPERS/ PUBLIC_SITE/generated/papers.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish compiled LaTeX papers and ordered index [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git reset --hard origin/main
          done
          exit 1
