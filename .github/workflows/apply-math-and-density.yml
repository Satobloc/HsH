name: Apply math and reading density

on:
  push:
    paths:
      - '.github/workflows/apply-math-and-density.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch viewer presentation
        run: python tools/patch_math_and_reading_density.py
      - name: Validate JavaScript
        run: |
          node --check CONVERSATION_VIEWER/viewer.js
          node --check CONVERSATION_VIEWER/presentation.js
      - name: Commit patch
        run: |
          if [[ -n "$(git status --porcelain CONVERSATION_VIEWER/index.html CONVERSATION_VIEWER/presentation.js CONVERSATION_VIEWER/presentation.css CONVERSATION_VIEWER/viewer.css)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CONVERSATION_VIEWER/index.html CONVERSATION_VIEWER/presentation.js CONVERSATION_VIEWER/presentation.css CONVERSATION_VIEWER/viewer.css
            git commit -m "Render math and refine conversation presentation"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No presentation patch changes needed."
          fi
