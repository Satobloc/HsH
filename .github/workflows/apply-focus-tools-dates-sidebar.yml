name: Apply focus tools dates sidebar

on:
  push:
    paths:
      - '.github/workflows/apply-focus-tools-dates-sidebar.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch viewer
        run: python tools/patch_focus_tools_dates_sidebar.py
      - name: Validate JavaScript
        run: |
          node --check CONVERSATION_VIEWER/viewer.js
          node --check CONVERSATION_VIEWER/presentation.js
      - name: Commit patch
        run: |
          if [[ -n "$(git status --porcelain CONVERSATION_VIEWER/viewer.js CONVERSATION_VIEWER/presentation.js CONVERSATION_VIEWER/viewer.css CONVERSATION_VIEWER/presentation.css CONVERSATION_VIEWER/index.html)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CONVERSATION_VIEWER/viewer.js CONVERSATION_VIEWER/presentation.js CONVERSATION_VIEWER/viewer.css CONVERSATION_VIEWER/presentation.css CONVERSATION_VIEWER/index.html
            git commit -m "Improve replay focus, compact plumbing, and surface dates"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No viewer patch changes needed."
          fi
