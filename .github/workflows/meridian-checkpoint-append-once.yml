name: Meridian checkpoint append once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meridian-checkpoint-append-once.yml'
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append checkpoint and remove helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          payload = ''
          p = Path('WORKSPACES/MERIDIAN/TRIAL_CHECKPOINT.md')
          text = p.read_text(encoding='utf-8').rstrip() + '\n\n' + base64.b64decode(payload).decode('utf-8').rstrip() + '\n'
          p.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/meridian-checkpoint-append-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add WORKSPACES/MERIDIAN/TRIAL_CHECKPOINT.md
          git commit -m 'Update Meridian trial checkpoint'
          git push