name: SAT candidate analysis sample

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sat-candidate-analysis-sample.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run sample candidate extractor
        run: |
          mkdir -p WORKSPACES/COMMON/analysis
          python WORKSPACES/COMMON/scripts/extract_nathan_sat_candidates.py DEVELOPMENT_FULL_CONVOS \
            --limit-files 8 \
            --out WORKSPACES/COMMON/analysis/nathan_sat_candidates_sample.jsonl \
            --examples WORKSPACES/COMMON/analysis/nathan_sat_examples_sample.md
      - name: Show sample summary
        run: |
          sed -n '1,260p' WORKSPACES/COMMON/analysis/nathan_sat_examples_sample.md
      - uses: actions/upload-artifact@v4
        with:
          name: nathan-sat-candidate-analysis-sample
          path: WORKSPACES/COMMON/analysis/
