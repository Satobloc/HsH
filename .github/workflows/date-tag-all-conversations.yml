name: Backfill and verify HsH conversation date tags

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/date-tag-all-conversations.yml'
      - 'tools/date_conversation_exports.py'
      - 'tools/audit_conversation_date_tags.py'
      - 'tools/conversation_json_sniff.py'
      # Process newly uploaded conversations rather than waiting for code edits.
      - 'DEVELOPMENT_FULL_CONVOS/**'
      - 'LIVE CONVOS/**'
      - '*.json'
      - '*.txt'
      - '**/*.json'
      - '**/*.txt'
  schedule:
    # Backstop for imports that occur while other Actions runs are queued.
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: hsh-date-tag-backfill
  cancel-in-progress: false

jobs:
  tag:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip hsh-date-tag]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout HsH main with all conversation sources
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Date-tag all datable JSON conversations and commit verified audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'HsH Date Tag Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4; do
            echo "Backfill attempt $attempt: synchronize before inspecting live files."
            git fetch origin main
            git reset --hard origin/main
            python -m unittest discover -s tests -p 'test_date_conversation_exports.py' -v

            mkdir -p indexes/manifests
            python tools/date_conversation_exports.py \
              "DEVELOPMENT_FULL_CONVOS" \
              --apply --resolve-collisions \
              --manifest indexes/manifests/development-conversation-dates.json
            python tools/date_conversation_exports.py \
              "LIVE CONVOS" \
              --apply --resolve-collisions \
              --manifest indexes/manifests/live-conversation-dates.json
            python tools/date_conversation_exports.py \
              "." \
              --apply --resolve-collisions \
              --manifest indexes/manifests/root-conversation-dates.json

            # Report undatable originals without fabricating historical times.
            python tools/audit_conversation_date_tags.py \
              --output indexes/manifests/date-tag-audit.json \
              --strict
            python -m json.tool indexes/manifests/root-conversation-dates.json >/dev/null

            # Rebuild the same derived surfaces used by both Viewer and chronology.
            python tools/build_conversation_viewer_resolved.py
            python tools/index_conversation_chronology.py \
              "DEVELOPMENT_FULL_CONVOS" \
              --output indexes/CONVERSATION_CHRONOLOGY.md
            python tools/index_conversation_chronology.py \
              "LIVE CONVOS" \
              --output indexes/LIVE_CONVERSATION_CHRONOLOGY.md
            python tools/index_conversation_chronology.py "." --output indexes/OTHER_HSH_CONVERSATION_CHRONOLOGY.md

            git add -A -- "DEVELOPMENT_FULL_CONVOS" "LIVE CONVOS"
            if [ -f "indexes/manifests/root-conversation-dates.json" ]; then
              python - <<'PY'
            import json
            import subprocess
            from pathlib import Path

            manifest = Path("indexes/manifests/root-conversation-dates.json")
            payload = json.loads(manifest.read_text(encoding="utf-8"))
            staged = 0
            for record in payload.get("records", []):
                if record.get("status") != "renamed":
                    continue
                old_path, new_path = record.get("old_path"), record.get("new_path")
                if isinstance(old_path, str) and isinstance(new_path, str):
                    subprocess.run(["git", "add", "-A", "--", ":(literal)" + old_path, ":(literal)" + new_path], check=True)
                    staged += 1
            print(f"staged_root_renames={staged}")
            PY
            fi
            git add -A -- \
              indexes/manifests/development-conversation-dates.json \
              indexes/manifests/live-conversation-dates.json \
              indexes/manifests/root-conversation-dates.json \
              indexes/manifests/date-tag-audit.json \
              indexes/CONVERSATION_CHRONOLOGY.md \
              indexes/LIVE_CONVERSATION_CHRONOLOGY.md \
              indexes/OTHER_HSH_CONVERSATION_CHRONOLOGY.md \
              CONVERSATION_VIEWER/data/conversations.json \
              CONVERSATION_VIEWER/data/curated

            if git diff --cached --quiet; then
              echo 'All date-tag and derived artifacts already match the current checkout.'
              break
            fi

            git commit -m '[skip hsh-maintenance] [skip hsh-date-tag] Apply and audit all HsH conversation date tags'
            if git push origin HEAD:main; then
              echo "Successfully committed date tags and verification ledger."
              break
            fi
            echo "Remote changed during date tagging; rebuilding from the current main." >&2
            if [ "$attempt" = 4 ]; then
              echo "::error::Could not commit date-tag changes after four fresh attempts."
              exit 1
            fi
          done

          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('indexes/manifests/date-tag-audit.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          print('Date-tag verification:', data['overall_counts'])
          print('all_datable_tagged:', data['all_datable_tagged'])
          print('all_conversations_have_dates:', data['all_conversations_have_dates'])
          if not data['all_datable_tagged']:
              for root in data['roots']:
                  for item in root['exceptions'][:20]:
                      if item.get('status') in {'planned', 'renamed', 'collision'}:
                          print('Strict blocker:',root['root'],item)
              raise SystemExit('A datable conversation still needs a date prefix or has an unresolved collision; see the audit ledger.')
          if not data['all_conversations_have_dates']:
              print('INFO: legitimate undatable conversation exceptions remain explicitly preserved; no dates were fabricated.')
          print('PASS: all datable HsH conversation exports have source-timestamp date prefixes.')
          PY
