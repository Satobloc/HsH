name: Mercer cross-source integrity

on:
  workflow_dispatch:
  push:
    paths:
      - 'WORKSPACES/MERCER/validate_cross_source_integrity.py'
      - 'WORKSPACES/MERCER/validate_cross_source_integrity_v2.py'
      - 'WORKSPACES/MERCER/viewer_input_semantics.py'
      - 'WORKSPACES/MERCER/test_validate_cross_source_integrity.py'
      - 'WORKSPACES/MERCER/test_integrity_failure_modes.py'
      - 'WORKSPACES/MERCER/diagnose_viewer_input_dedup.py'
      - 'WORKSPACES/MERCER/diagnose_conversation_identity_duplicates.py'
      - 'WORKSPACES/MERCER/diagnose_conversation_identity_duplicates_v4.py'
      - 'CONVERSATION_VIEWER/data/conversations.json'
      - 'CONVERSATION_VIEWER/EXTERNAL_CONVERSATIONS.json'
      - 'CONVERSATION_VIEWER/data/discovered_external_conversations.json'
      - 'indexes/manifests/**'
      - 'indexes/nathan-direct/**/MANIFEST.json'
      - '.github/workflows/mercer-cross-source-integrity.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression fixture
        run: python WORKSPACES/MERCER/test_validate_cross_source_integrity.py
      - name: Failure-mode competence harness
        run: python WORKSPACES/MERCER/test_integrity_failure_modes.py
      - name: Viewer input dedup diagnostic
        run: |
          mkdir -p /tmp/mercer-integrity
          python WORKSPACES/MERCER/diagnose_viewer_input_dedup.py | tee /tmp/mercer-integrity/viewer-input-dedup.json
      - name: Conversation identity duplicate diagnostic v4
        run: |
          mkdir -p /tmp/mercer-integrity
          python WORKSPACES/MERCER/diagnose_conversation_identity_duplicates_v4.py | tee /tmp/mercer-integrity/conversation-identity-duplicates-v4.json
      - name: Production metadata validation
        run: |
          mkdir -p /tmp/mercer-integrity
          python WORKSPACES/MERCER/validate_cross_source_integrity_v2.py \
            --repo-root . \
            --json-out /tmp/mercer-integrity/report-v2.json \
            --md-out /tmp/mercer-integrity/report-v2.md
          cat /tmp/mercer-integrity/report-v2.md
      - name: Legacy validator reference
        if: always()
        continue-on-error: true
        run: |
          mkdir -p /tmp/mercer-integrity
          python WORKSPACES/MERCER/validate_cross_source_integrity.py \
            --repo-root . \
            --json-out /tmp/mercer-integrity/report-legacy.json \
            --md-out /tmp/mercer-integrity/report-legacy.md
          cat /tmp/mercer-integrity/report-legacy.md
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mercer-cross-source-integrity
          path: /tmp/mercer-integrity/
          if-no-files-found: warn
