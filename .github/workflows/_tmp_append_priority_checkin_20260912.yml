name: Temporary append priority-assessment past-theorist check-in

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "WORKSPACES/COMMON/.priority-assessment-checkin-20260912.tmp.md"

permissions:
  contents: write

concurrency:
  group: append-priority-assessment-checkin-20260912
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Append check-in atomically
        shell: bash
        run: |
          set -euo pipefail
          TARGET="WORKSPACES/COMMON/PAST_THEORIST_CHECKINS.md"
          ENTRY="WORKSPACES/COMMON/.priority-assessment-checkin-20260912.tmp.md"
          HEADING='### GPT-5.6 Sol / Priority Assessment + Evidence Audit Thread'

          git config user.name "Past Theorist Check-In Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main

            if grep -Fq "$HEADING" "$TARGET"; then
              echo "Check-in already present; nothing to do."
              exit 0
            fi

            printf '\n\n---\n\n' >> "$TARGET"
            cat "$ENTRY" >> "$TARGET"
            git add "$TARGET"
            git commit -m "[skip hsh-maintenance] Append priority assessment past-theorist check-in"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push raced with another update; retrying from current main."
          done

          echo "Failed to append after retries." >&2
          exit 1
