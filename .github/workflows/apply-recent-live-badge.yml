name: Apply recent live badge rule

on:
  push:
    paths:
      - '.github/workflows/apply-recent-live-badge.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch viewer Live badge rule
        run: python tools/patch_recent_live_badge.py
      - name: Validate JavaScript
        run: node --check CONVERSATION_VIEWER/viewer.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CONVERSATION_VIEWER/viewer.js
          git commit -m "Show Live badge only for recent conversations"
          git pull --rebase origin main
          git push origin HEAD:main
