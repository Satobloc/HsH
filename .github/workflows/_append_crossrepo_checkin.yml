name: Append cross-repo check-in once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/_append_crossrepo_checkin.yml"

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Append staged check-ins
        shell: bash
        run: |
          set -euo pipefail
          CHECKIN_MARKER='### Cross-Repo Admin (Archive Audit thread) — 2026-09-12'
          if ! grep -Fq "$CHECKIN_MARKER" WORKSPACES/COMMON/CHECKINS.md; then
            cat WORKSPACES/COMMON/.crossrepo_checkin_payload.md >> WORKSPACES/COMMON/CHECKINS.md
          fi
          if ! grep -Fq "$CHECKIN_MARKER" WORKSPACES/COMMON/QUARANTINE_THEORY_METHOD_CHECKINS.md; then
            cat WORKSPACES/COMMON/.crossrepo_diag_payload.md >> WORKSPACES/COMMON/QUARANTINE_THEORY_METHOD_CHECKINS.md
          fi
          rm -f WORKSPACES/COMMON/.crossrepo_checkin_payload.md
          rm -f WORKSPACES/COMMON/.crossrepo_diag_payload.md
          rm -f .github/workflows/_append_crossrepo_checkin.yml
          git config user.name 'Cross-Repo Admin'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m '[skip hsh-maintenance] Add cross-repo admin check-ins'
          git pull --rebase origin main
          git push origin HEAD:main
