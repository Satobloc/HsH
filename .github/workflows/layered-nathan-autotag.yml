name: Archive-wide layered conversation autotag

on:
  push:
    branches: [main]
    paths:
      - '**/*.json'
      - 'WORKSPACES/COMMON/scripts/layered_autotag_nathan.py'
      - '.github/workflows/layered-nathan-autotag.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hsh-layered-autotag-main
  cancel-in-progress: false

jobs:
  autotag:
    if: ${{ github.event_name != 'push' || (!contains(github.event.head_commit.message, '[skip autotag]') && !contains(github.event.head_commit.message, '[skip hsh-maintenance]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run archive-wide layered autotagger
        run: |
          mkdir -p WORKSPACES/COMMON/analysis indexes/autotag
          python WORKSPACES/COMMON/scripts/layered_autotag_nathan.py . \
            --out WORKSPACES/COMMON/analysis/archive_layered_autotags.jsonl \
            --summary indexes/autotag/AUTOTAG_SUMMARY.md \
            --index indexes/autotag/CONVERSATION_TAG_INDEX.md \
            --manifest indexes/autotag/conversation-tag-manifest.json \
            --user-tag-index indexes/autotag/user-message-tags.jsonl \
            --structural-index-state indexes/index-state.json \
            --window 4
      - name: Validate durable tag outputs
        run: |
          python -m json.tool indexes/autotag/conversation-tag-manifest.json >/dev/null
          test -s indexes/autotag/CONVERSATION_TAG_INDEX.md
          test -s indexes/autotag/user-message-tags.jsonl
      - name: Show summary
        run: sed -n '1,320p' indexes/autotag/AUTOTAG_SUMMARY.md
      - name: Commit durable autotag indexes
        run: |
          git config user.name "H(s)H Autotag Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indexes/autotag
          if git diff --cached --quiet; then
            echo "Autotag indexes already current"
          else
            git commit -m "[skip autotag] Refresh archive-wide conversation autotags"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: archive-wide-layered-autotags
          path: |
            WORKSPACES/COMMON/analysis/archive_layered_autotags.jsonl
            indexes/autotag/
