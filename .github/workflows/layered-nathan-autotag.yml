name: Archive-wide layered conversation autotag

on:
  push:
    branches: [main]
    paths:
      - 'DEVELOPMENT_FULL_CONVOS/**/*.json'
      - 'DEVELOPMENT_FULL_CONVOS/**/*.txt'
      - 'LIVE CONVOS/**/*.json'
      - 'LIVE CONVOS/**/*.txt'
      - 'WORKSPACES/COMMON/scripts/layered_autotag_nathan.py'
      - 'WORKSPACES/COMMON/scripts/layered_autotag_nathan_v2.py'
      - 'WORKSPACES/COMMON/scripts/layered_autotag_nathan_v3.py'
      - 'WORKSPACES/COMMON/scripts/package_nathan_direct.py'
      - 'WORKSPACES/COMMON/scripts/build_nathan_direct_stage2_queues.py'
      - '.github/workflows/layered-nathan-autotag.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hsh-layered-autotag-main
  cancel-in-progress: false

jobs:
  autotag:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip autotag]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate autotag tooling
        run: |
          python -m py_compile WORKSPACES/COMMON/scripts/layered_autotag_nathan.py
          python -m py_compile WORKSPACES/COMMON/scripts/layered_autotag_nathan_v2.py
          python -m py_compile WORKSPACES/COMMON/scripts/layered_autotag_nathan_v3.py
          python -m py_compile WORKSPACES/COMMON/scripts/package_nathan_direct.py
          python -m py_compile WORKSPACES/COMMON/scripts/build_nathan_direct_stage2_queues.py
          python -m unittest discover -s tests -p 'test_autotag_selectivity_v3.py' -v
      - name: Run archive-wide layered autotagger
        run: |
          mkdir -p WORKSPACES/COMMON/analysis indexes/autotag indexes/nathan-direct
          python WORKSPACES/COMMON/scripts/layered_autotag_nathan_v3.py . \
            --out WORKSPACES/COMMON/analysis/archive_layered_autotags.jsonl \
            --summary indexes/autotag/AUTOTAG_SUMMARY.md \
            --index indexes/autotag/CONVERSATION_TAG_INDEX.md \
            --manifest indexes/autotag/conversation-tag-manifest.json \
            --user-tag-index indexes/autotag/user-message-tags.jsonl \
            --structural-index-state indexes/index-state.json \
            --window 4
      - name: Package Nathan Direct substrate
        run: |
          rm -rf indexes/nathan-direct
          python WORKSPACES/COMMON/scripts/package_nathan_direct.py \
            WORKSPACES/COMMON/analysis/archive_layered_autotags.jsonl \
            --outdir indexes/nathan-direct
      - name: Build non-destructive Stage-2 queues
        run: |
          python WORKSPACES/COMMON/scripts/build_nathan_direct_stage2_queues.py \
            indexes/nathan-direct \
            --outdir indexes/nathan-direct/stage2
      - name: Validate durable outputs
        run: |
          python -m json.tool indexes/autotag/conversation-tag-manifest.json >/dev/null
          python -m json.tool indexes/nathan-direct/MANIFEST.json >/dev/null
          python -m json.tool indexes/nathan-direct/stage2/MANIFEST.json >/dev/null
          test -s indexes/autotag/CONVERSATION_TAG_INDEX.md
          test -s indexes/autotag/user-message-tags.jsonl
          test -s indexes/nathan-direct/README.md
          test -s indexes/nathan-direct/stage2/correction-refinement.jsonl
          find indexes/nathan-direct -maxdepth 1 -name 'nathan-direct-*.jsonl' -type f -size +0c | grep -q .
      - name: Show summaries
        run: |
          sed -n '1,320p' indexes/autotag/AUTOTAG_SUMMARY.md
          cat indexes/nathan-direct/README.md
          cat indexes/nathan-direct/stage2/MANIFEST.json
      - name: Commit durable autotag, Nathan Direct, and Stage-2 indexes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "H(s)H Autotag Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          SNAP="$RUNNER_TEMP/autotag-generated-snapshot"
          rm -rf "$SNAP"
          mkdir -p "$SNAP"
          cp -a indexes/autotag "$SNAP/autotag"
          cp -a indexes/nathan-direct "$SNAP/nathan-direct"

          # Never rebase deterministic generated artifacts. If another worker advances
          # main while this long corpus pass runs, discard the local generated commit,
          # reset to latest main, re-lay the validated snapshot, and retry. Conversation
          # source pushes are serialized and queue their own later autotag run, so this
          # snapshot remains tied honestly to the source state that produced it.
          for attempt in 1 2 3 4; do
            echo "Publish attempt ${attempt}/4"
            git fetch origin main
            git reset --hard origin/main

            rm -rf indexes/autotag indexes/nathan-direct
            cp -a "$SNAP/autotag" indexes/autotag
            cp -a "$SNAP/nathan-direct" indexes/nathan-direct

            python -m json.tool indexes/autotag/conversation-tag-manifest.json >/dev/null
            python -m json.tool indexes/nathan-direct/MANIFEST.json >/dev/null
            python -m json.tool indexes/nathan-direct/stage2/MANIFEST.json >/dev/null
            test -s indexes/autotag/CONVERSATION_TAG_INDEX.md
            test -s indexes/autotag/user-message-tags.jsonl

            git add indexes/autotag indexes/nathan-direct
            if git diff --cached --quiet; then
              echo "Autotag, Nathan Direct, and Stage-2 indexes already current for this generated snapshot"
              exit 0
            fi

            git commit -m "[skip autotag] Refresh archive-wide tags and Nathan Direct packages"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push race on attempt ${attempt}; discarding generated commit and retrying from latest main." >&2
            sleep $((attempt * 2))
          done

          echo "Unable to publish generated indexes after four rebuild-from-main retries." >&2
          exit 1
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: archive-wide-layered-autotags
          path: |
            WORKSPACES/COMMON/analysis/archive_layered_autotags.jsonl
            indexes/autotag/
            indexes/nathan-direct/
