name: Merge verified provenance batches

on:
  push:
    paths:
      - 'WORKSPACES/COMMON/verified_batches/**'

permissions:
  contents: write

concurrency:
  group: hsh-verified-batch-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Append and push unmerged verified batches
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            python - <<'PY'
          from pathlib import Path

          compendium = Path('WORKSPACES/COMMON/NATHAN_VERIFIED_WORDS_COMPENDIUM.md')
          batch_dir = Path('WORKSPACES/COMMON/verified_batches')
          original = compendium.read_text(encoding='utf-8')
          merged = original
          added = []

          for path in sorted(batch_dir.glob('*.md')):
              text = path.read_text(encoding='utf-8').strip()
              if not text:
                  continue
              heading = next((line.strip() for line in text.splitlines() if line.startswith('## Excavation batch ')), None)
              if not heading:
                  print(f'SKIP {path}: no excavation batch heading')
                  continue
              if heading in merged:
                  print(f'ALREADY MERGED {path}: {heading}')
                  continue
              merged = merged.rstrip() + '\n\n---\n\n' + text + '\n'
              added.append(str(path))
              print(f'APPEND {path}: {heading}')

          if added:
              compendium.write_text(merged, encoding='utf-8')
              print('ADDED', len(added), 'batch(es)')
          else:
              print('NO UNMERGED BATCHES')
          PY

            git add WORKSPACES/COMMON/NATHAN_VERIFIED_WORDS_COMPENDIUM.md
            if git diff --cached --quiet; then
              echo 'No compendium changes.'
              exit 0
            fi
            git commit -m 'Merge verified provenance batch into compendium'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent main update on attempt $attempt; retrying from fresh origin/main"
          done
          echo 'Failed to merge verified batches after retries.' >&2
          exit 1
