name: Superset conversation duplicate scan

on:
  push:
    branches: [main]
    paths:
      - 'WORKSPACES/COMMON/scripts/find_superset_conversation_duplicates.py'
      - '.github/workflows/superset-conversation-duplicate-scan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan for strict historical subsets
        run: |
          mkdir -p WORKSPACES/COMMON/analysis
          if [ -d "LIVE CONVOS" ]; then
            python WORKSPACES/COMMON/scripts/find_superset_conversation_duplicates.py \
              DEVELOPMENT_FULL_CONVOS "LIVE CONVOS" \
              --json WORKSPACES/COMMON/analysis/superset_duplicate_candidates.json \
              --report WORKSPACES/COMMON/analysis/superset_duplicate_report.md
          else
            python WORKSPACES/COMMON/scripts/find_superset_conversation_duplicates.py \
              DEVELOPMENT_FULL_CONVOS \
              --json WORKSPACES/COMMON/analysis/superset_duplicate_candidates.json \
              --report WORKSPACES/COMMON/analysis/superset_duplicate_report.md
          fi
      - name: Show report
        run: sed -n '1,320p' WORKSPACES/COMMON/analysis/superset_duplicate_report.md
      - uses: actions/upload-artifact@v4
        with:
          name: superset-conversation-duplicate-scan
          path: WORKSPACES/COMMON/analysis/superset_duplicate_*
