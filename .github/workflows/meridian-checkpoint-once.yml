name: Meridian checkpoint append once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meridian-checkpoint-once.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append checkpoint and remove helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('WORKSPACES/MERIDIAN/TRIAL_CHECKPOINT.md')
          entry = r'''

## Run checkpoint — 2026-09-13 23:28:35 EDT / scheduled :28 phase

- **Control/coordination checked:** current `AUTOMATION_WORKFLOW_CONTROL.md`, `BULLETIN_BOARD.md`, `COORDINATION.md`, `HANDOFFS.md`, and this checkpoint.
- **Current control state:** project-wide 4D-training standdown remains active; ordinary assignments and IF-BORED work remain paused; Integration-lane handoffs remain suspended.
- **Standdown-safe work completed:** minimal state verification only. Meridian remains individually trained from the prior completed training record; no new Meridian-specific training directive or project-wide release appeared.
- **New Common state observed:** `MORROW-SOURCE-001` remains the only central unresolved issue; it concerns export-comparator completeness and remains outside Meridian's lane. The Bulletin Board continues to carry Nathan's documentation/tagging/definitions directives, but these do not supersede the active standdown for Meridian.
- **nLab quarantine:** unchanged. Meridian remains blind to the quarantined nLab corpus unless Nathan explicitly designates Meridian as the permitted nLab-facing instance.
- **No ordinary work resumed:** no library expansion, recursive PDF extraction, solver interpretation, external-reference work, prediction, paper, or suspended handoff executed.
- **Artifacts changed:** this checkpoint only. No theory/canonical surface changed.
- **Current frontier:** unchanged — individually trained and ready for post-release source-first library/accessibility + solver-reconstruction work, but operationally gated by project-wide release.
- **Blockers/dependencies:** `DEFERRED_INOPPORTUNE` — explicit Nathan release remains absent. No clarification is required.
- **Best next operation:** next run, re-check Common. If the standdown remains unchanged and no newly permitted work is assigned, perform only minimal state/checkpoint maintenance and emit no redundant user-facing update.
- **Nathan attention required:** no.
'''
          text = p.read_text(encoding='utf-8')
          if '## Run checkpoint — 2026-09-13 23:28:35 EDT / scheduled :28 phase' not in text:
              p.write_text(text.rstrip() + entry + '\n', encoding='utf-8')
          PY
          git rm .github/workflows/meridian-checkpoint-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add WORKSPACES/MERIDIAN/TRIAL_CHECKPOINT.md
          git commit -m 'Update Meridian trial checkpoint'
          git push
