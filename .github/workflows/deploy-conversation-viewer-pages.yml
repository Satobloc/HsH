name: Deploy conversation viewer to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'CONVERSATION_VIEWER/index.html'
      - 'CONVERSATION_VIEWER/*.js'
      - 'CONVERSATION_VIEWER/*.css'
      - 'CONVERSATION_VIEWER/mersearch/**'
      - 'CONVERSATION_VIEWER/data/**'
      - 'tools/build_conversation_viewer.py'
      - 'tools/build_mersearch_public_catalog.py'
      - 'WORKSPACES/MERCER/test_mersearch_public_catalog.py'
      - 'indexes/manifests/development-conversation-dates.json'
      - 'indexes/manifests/live-conversation-dates.json'
      - 'CONVERSATION_VIEWER/EXTERNAL_CONVERSATIONS.json'
      - 'CONVERSATION_VIEWER/CURATION.json'
      - '.github/workflows/deploy-conversation-viewer-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: conversation-viewer-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Rebuild conversation catalog for deployment
        run: python tools/build_conversation_viewer.py

      - name: Generate publicly curated Mersearch catalog
        run: |
          python tools/build_mersearch_public_catalog.py \
            --catalog CONVERSATION_VIEWER/data/conversations.json \
            --output CONVERSATION_VIEWER/mersearch/data/catalog.json
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('CONVERSATION_VIEWER/mersearch/data/catalog.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          assert data['kind']=='public-conversation-catalog'
          assert data['coverage_status']=='partial'
          assert data['catalog_entries'] > 0
          assert 'Satobloc/HSH_RESOURCES' not in data['archives_searched']
          assert all('HSH_RESOURCES' not in json.dumps(x) for x in data['hits'])
          print('MERSEARCH_PUBLIC_CATALOG='+str(data['catalog_entries']))
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload conversation viewer
        uses: actions/upload-pages-artifact@v4
        with:
          path: CONVERSATION_VIEWER

      - name: Deploy conversation viewer
        id: deployment
        uses: actions/deploy-pages@v4
