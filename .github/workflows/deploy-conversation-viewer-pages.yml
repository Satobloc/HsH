name: Deploy conversation viewer to GitHub Pages

# Manual-only until GitHub Pages is enabled for this repository with Source = GitHub Actions.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: conversation-viewer-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload conversation viewer
        uses: actions/upload-pages-artifact@v4
        with:
          path: CONVERSATION_VIEWER

      - name: Deploy conversation viewer
        id: deployment
        uses: actions/deploy-pages@v4
