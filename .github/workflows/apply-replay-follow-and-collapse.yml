name: Apply replay follow and collapse

on:
  push:
    paths:
      - '.github/workflows/apply-replay-follow-and-collapse.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch viewer behavior
        run: python tools/patch_replay_follow_and_collapse.py
      - name: Validate JavaScript
        run: |
          node --check CONVERSATION_VIEWER/viewer.js
          node --check CONVERSATION_VIEWER/presentation.js
      - name: Commit patch
        run: |
          if [[ -n "$(git status --porcelain CONVERSATION_VIEWER/viewer.js CONVERSATION_VIEWER/presentation.js CONVERSATION_VIEWER/viewer.css)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CONVERSATION_VIEWER/viewer.js CONVERSATION_VIEWER/presentation.js CONVERSATION_VIEWER/viewer.css
            git commit -m "Improve typealong tracking and collapse long output"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No viewer patch changes needed."
          fi
