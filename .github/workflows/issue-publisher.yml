name: HsH Issue Publication Intake
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  group: hsh-issue-publisher
  cancel-in-progress: false
jobs:
  publish:
    if: startsWith(github.event.issue.title, '[HSH-PUBLISH-V1]') && github.event.issue.author_association == 'OWNER'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate, publish and read back
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/issue_publish.py
