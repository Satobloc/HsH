name: Append verified provenance batch - Reasoning with SAT-HSH Skill

on:
  push:
    branches: [main]
    paths:
      - 'WORKSPACES/COMMON/scripts/append_reasoning_provenance_batch.py'
      - '.github/workflows/append-provenance-reasoning-batch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebase onto current main
        run: git pull --rebase origin main
      - name: Append verified entries
        run: python WORKSPACES/COMMON/scripts/append_reasoning_provenance_batch.py
      - name: Commit and push if changed
        shell: bash
        run: |
          if git diff --quiet -- WORKSPACES/COMMON/NATHAN_VERIFIED_WORDS_COMPENDIUM.md; then
            echo "No compendium changes."
            exit 0
          fi
          git config user.name "Satobloc provenance bot"
          git config user.email "actions@users.noreply.github.com"
          git add WORKSPACES/COMMON/NATHAN_VERIFIED_WORDS_COMPENDIUM.md
          git commit -m "Append verified Nathan provenance from Reasoning with SAT-HSH Skill"
          git pull --rebase origin main
          git push origin HEAD:main
