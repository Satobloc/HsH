name: Apply dialogue replay and view modes

on:
  push:
    paths:
      - '.github/workflows/apply-dialogue-replay-view-modes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch viewer behavior
        run: python tools/patch_dialogue_replay_and_view_modes.py
      - name: Validate JavaScript
        run: |
          node --check CONVERSATION_VIEWER/viewer.js
          node --check CONVERSATION_VIEWER/presentation.js
      - name: Commit viewer changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CONVERSATION_VIEWER/viewer.js CONVERSATION_VIEWER/presentation.js CONVERSATION_VIEWER/index.html CONVERSATION_VIEWER/viewer.css
          git commit -m "Make replay dialogue-only and add view modes"
          git pull --rebase origin main
          git push origin HEAD:main
