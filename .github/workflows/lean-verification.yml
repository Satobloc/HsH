name: Lean 4 verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "FORMAL_VERIFICATION/**"
      - ".github/workflows/lean-verification.yml"
  push:
    branches: [main]
    paths:
      - "FORMAL_VERIFICATION/**"
      - ".github/workflows/lean-verification.yml"

permissions:
  contents: read

concurrency:
  group: lean-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Generate Lake dependency manifest
        working-directory: FORMAL_VERIFICATION
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lake" update
      - name: Install Lean and compile formal library
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: FORMAL_VERIFICATION
          use-mathlib-cache: "true"
          build: "true"
          test: "false"
          lint: "false"
      - name: Record environment
        if: always()
        working-directory: FORMAL_VERIFICATION
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          set -euo pipefail
          echo "Event GITHUB_SHA: $GITHUB_SHA"
          echo "Checked-out commit: $(git rev-parse HEAD)"
          echo "PR head SHA: ${PR_HEAD_SHA:-none}"
          cat lean-toolchain
          if command -v lean >/dev/null; then lean --version; fi
          if command -v lake >/dev/null; then lake --version; fi
