name: Apply 25-line truncation

on:
  push:
    paths:
      - '.github/workflows/apply-25line-truncation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch viewer
        run: python tools/patch_25line_truncation_and_replay_runway.py
      - name: Validate JavaScript
        run: |
          node --check CONVERSATION_VIEWER/viewer.js
          node --check CONVERSATION_VIEWER/presentation.js
      - name: Commit patch
        run: |
          if [[ -n "$(git status --porcelain CONVERSATION_VIEWER/viewer.js CONVERSATION_VIEWER/presentation.js CONVERSATION_VIEWER/viewer.css CONVERSATION_VIEWER/presentation.css)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CONVERSATION_VIEWER/viewer.js CONVERSATION_VIEWER/presentation.js CONVERSATION_VIEWER/viewer.css CONVERSATION_VIEWER/presentation.css
            git commit -m "Use rendered 25-line truncation and replay runway"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No viewer patch changes needed."
          fi
