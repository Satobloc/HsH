name: Apply conversation families and date search

on:
  push:
    paths:
      - '.github/workflows/apply-conversation-families-date-search.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply viewer/catalog patch
        run: python tools/patch_conversation_families_and_date_search.py
      - name: Validate Python and JavaScript
        run: |
          python -m py_compile tools/build_conversation_viewer.py
          node --check CONVERSATION_VIEWER/viewer.js
      - name: Commit patch
        run: |
          if [[ -n "$(git status --porcelain tools/build_conversation_viewer.py CONVERSATION_VIEWER/viewer.js CONVERSATION_VIEWER/viewer.css .github/workflows/build-conversation-viewer.yml .github/workflows/deploy-conversation-viewer-pages.yml)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/build_conversation_viewer.py CONVERSATION_VIEWER/viewer.js CONVERSATION_VIEWER/viewer.css .github/workflows/build-conversation-viewer.yml .github/workflows/deploy-conversation-viewer-pages.yml
            git commit -m "Group conversation versions and add date-aware search"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No patch changes needed."
          fi
