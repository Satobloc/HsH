name: Patch viewer role-aware replay speed

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-viewer-role-speed.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply role-aware replay speed
        run: |
          python - <<'PY'
          from pathlib import Path

          js_path = Path('CONVERSATION_VIEWER/viewer.js')
          js = js_path.read_text(encoding='utf-8')
          replacements = {
              'function replaySpeed() { return Number(el.replaySpeed.value) || 1; }': '''function replaySpeed(index = null) {
    const base = Number(el.replaySpeed.value) || 1;
    if (index == null) return base;
    return state.messages[index]?.role === "assistant" ? base * 10 : base;
  }''',
              'const charsPerSecond = 48 * replaySpeed(); let shown = 0; body.textContent = "";': 'const charsPerSecond = 48 * replaySpeed(index); let shown = 0; body.textContent = "";',
              '(state.messages[i].text.length / (42 * replaySpeed())) * 1000': '(state.messages[i].text.length / (42 * replaySpeed(i))) * 1000',
              '300 + state.messages[i].text.length * 0.7) / replaySpeed(), token': '300 + state.messages[i].text.length * 0.7) / replaySpeed(i), token',
          }
          for old, new in replacements.items():
              if old not in js:
                  raise SystemExit(f'missing viewer.js patch anchor: {old}')
              js = js.replace(old, new, 1)
          js_path.write_text(js, encoding='utf-8', newline='\n')

          html_path = Path('CONVERSATION_VIEWER/index.html')
          html = html_path.read_text(encoding='utf-8')
          old = '<option value="1">1×</option>\n              <option value="2">2×</option>\n              <option value="5">5×</option>\n              <option value="10" selected>10×</option>'
          new = '<option value="1" selected>1×</option>\n              <option value="2">2×</option>\n              <option value="5">5×</option>\n              <option value="10">10×</option>'
          if old not in html:
              raise SystemExit('missing index.html speed anchor')
          html_path.write_text(html.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY

          node --check CONVERSATION_VIEWER/viewer.js
          node --check CONVERSATION_VIEWER/presentation.js

      - name: Commit patch
        run: |
          if git diff --quiet -- CONVERSATION_VIEWER/viewer.js CONVERSATION_VIEWER/index.html; then
            echo 'No replay speed changes needed.'
            exit 0
          fi
          git config user.name 'HsH Conversation Viewer Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CONVERSATION_VIEWER/viewer.js CONVERSATION_VIEWER/index.html
          git commit -m 'Make assistant replay 10x by default'
          git push origin HEAD:main
