name: Build cross-repo visual catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
  push:
    paths:
      - 'tools/visual_catalog/**'
      - '.github/workflows/build-visual-catalog.yml'

permissions:
  contents: write

concurrency:
  group: cross-repo-visual-catalog
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HsH
        uses: actions/checkout@v4
        with:
          path: HsH

      - name: Checkout SAT archive
        uses: actions/checkout@v4
        with:
          repository: Satobloc/SAT_THEORY_ARCHIVE_2023-25
          path: SAT_THEORY_ARCHIVE_2023-25

      - name: Checkout HSH resources
        uses: actions/checkout@v4
        with:
          repository: Satobloc/HSH_RESOURCES
          path: HSH_RESOURCES

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Build catalog
        run: |
          python HsH/tools/visual_catalog/build_catalog.py \
            --hsh HsH \
            --sat SAT_THEORY_ARCHIVE_2023-25 \
            --resources HSH_RESOURCES \
            --out HsH/tools/visual_catalog/derived

      - name: Show summary
        run: cat HsH/tools/visual_catalog/derived/summary.json

      - name: Commit generated catalog
        working-directory: HsH
        shell: bash
        run: |
          git config user.name "visual catalog bot"
          git config user.email "actions@users.noreply.github.com"
          git add tools/visual_catalog/derived
          if git diff --cached --quiet; then
            echo "No catalog changes"
          else
            git commit -m "Update cross-repo visual catalog"
            git pull --rebase origin main
            git push
          fi
