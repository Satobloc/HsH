name: Find SRENA orphan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/find-srena-orphan.yml'

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          lfs: false

      - name: Search filenames and repository text
        shell: bash
        run: |
          set +e
          echo '=== PATH MATCHES: SRENA / SERENA ==='
          git ls-files | grep -iE 'srena|serena' | head -100
          echo
          echo '=== CONTENT MATCHES: SRENA / SERENA ==='
          git grep -n -i -I -E 'srena|serena' -- ':!*.pdf' ':!*.png' ':!*.jpg' ':!*.jpeg' ':!*.gif' ':!*.webp' ':!*.zip' ':!*.mp3' ':!*.mp4' ':!*.mov' 2>/dev/null | head -200
          echo
          echo '=== LIKELY CONVERSATION FILES OUTSIDE VIEWER INPUTS ==='
          python - <<'PY'
          from pathlib import Path
          import re

          indexed_roots = ('DEVELOPMENT_FULL_CONVOS/', 'LIVE CONVOS/')
          conversation_words = re.compile(r'(convo|conversation|chat|claude|gemini|gpt|srena|serena)', re.I)
          allowed = {'.json', '.txt', '.md', '.html', '.htm', '.jsonl'}
          rows = []
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.suffix.lower() not in allowed:
                  continue
              s = p.as_posix().lstrip('./')
              if s.startswith(indexed_roots):
                  continue
              if conversation_words.search(s):
                  try:
                      size = p.stat().st_size
                  except OSError:
                      continue
                  rows.append((size, s))
          for size, path in sorted(rows, reverse=True)[:250]:
              print(f'{size:>12}  {path}')
          PY
