name: Append Meridian roster check-in once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/append-meridian-checkin-once.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append Meridian check-in if absent
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('WORKSPACES/COMMON/CHECKINS.md')
          heading = '### Meridian — 2026-09-12'
          text = path.read_text(encoding='utf-8')
          if heading in text:
              print('Meridian check-in already present; no change.')
              raise SystemExit(0)

          entry = r'''

