name: Append Meridian roster check-in once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/append-meridian-checkin-once.yml'
      - '.github/meridian-checkin-2026-09-12.md'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append check-in if absent
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          target = Path('WORKSPACES/COMMON/CHECKINS.md')
          source = Path('.github/meridian-checkin-2026-09-12.md')
          if not source.exists():
              raise SystemExit(0)
          text = target.read_text(encoding='utf-8')
          entry = source.read_text(encoding='utf-8').strip()
          if '### Meridian — 2026-09-12' in text:
              raise SystemExit(0)
          target.write_text(text.rstrip() + '\n\n' + entry + '\n', encoding='utf-8')
          PY
      - name: Commit check-in
        shell: bash
        run: |
          if git diff --quiet -- WORKSPACES/COMMON/CHECKINS.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add WORKSPACES/COMMON/CHECKINS.md
          git commit -m 'Append Meridian roster check-in'
          git push
