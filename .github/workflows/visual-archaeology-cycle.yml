name: Visual archaeology hypothesis cycle

on:
  workflow_dispatch:
  push:
    # Source/config changes rerun immediately. Derived bot commits are intentionally
    # absent from this list, preventing a self-trigger loop.
    paths:
      - 'DEVELOPMENT_FULL_CONVOS/**/*.png'
      - 'DEVELOPMENT_FULL_CONVOS/**/*.jpg'
      - 'DEVELOPMENT_FULL_CONVOS/**/*.jpeg'
      - 'SAT_VISUALS/**/*.png'
      - 'SAT_VISUALS/**/*.jpg'
      - 'SAT_VISUALS/**/*.jpeg'
      - 'tools/visual_archaeology/hypothesis_cycle.py'
      - 'tools/visual_archaeology/hypothesis_cycle_v2.py'
      - 'tools/visual_archaeology/run_visual_cycle.py'
      - 'tools/visual_archaeology/render_review_markdown.py'
      - 'tools/visual_archaeology/render_review_html.py'
      - 'tools/visual_archaeology/hypothesis_rules.json'
      - 'tools/visual_archaeology/sampling_manifest.json'
      - 'tools/visual_archaeology/visual_analyzer.py'
      - 'tools/visual_archaeology/seed_calibration.jsonl'
      - 'tools/visual_archaeology/seed_measurements_2026-09-30.json'
      - 'tools/visual_archaeology/human_reviews/**/*.json'
      - '.github/workflows/visual-archaeology-cycle.yml'
  schedule:
    # Hard-coded repo-local checkpoint. GitHub scheduled Actions may start late.
    - cron: '48 * * * *'

permissions:
  contents: write

concurrency:
  group: visual-archaeology-hypothesis-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image dependency
        run: python -m pip install --quiet pillow

      - name: Run nested hypothesis/check cycles
        run: python tools/visual_archaeology/run_visual_cycle.py

      - name: Render GitHub-native review sheet
        run: python tools/visual_archaeology/render_review_markdown.py

      - name: Render interactive review sheet
        run: python tools/visual_archaeology/render_review_html.py

      - name: Commit durable state
        shell: bash
        run: |
          git config user.name "visual archaeology bot"
          git config user.email "actions@users.noreply.github.com"
          git add tools/visual_archaeology/derived
          if git diff --cached --quiet; then
            echo "No visual-hypothesis state changes"
          else
            git commit -m "Update visual hypothesis-cycle state"
            git pull --rebase origin main
            git push
          fi