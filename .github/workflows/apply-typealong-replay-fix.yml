name: Apply typealong replay fix

on:
  push:
    paths:
      - '.github/workflows/apply-typealong-replay-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch replay behavior
        run: python tools/patch_typealong_replay.py
      - name: Validate JavaScript
        run: |
          node --check CONVERSATION_VIEWER/viewer.js
          node --check CONVERSATION_VIEWER/presentation.js
      - name: Commit patch
        run: |
          if [[ -n "$(git status --porcelain CONVERSATION_VIEWER/viewer.js CONVERSATION_VIEWER/presentation.js)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CONVERSATION_VIEWER/viewer.js CONVERSATION_VIEWER/presentation.js
            git commit -m "Fix typealong future-content and skip behavior"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No replay patch changes needed."
          fi
