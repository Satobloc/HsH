name: Apply single viewer front door

on:
  push:
    paths:
      - '.github/workflows/apply-single-viewer-frontdoor.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Point README directly at hosted viewer
        run: python tools/patch_single_viewer_frontdoor.py
      - name: Commit README cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Link README directly to single conversation viewer"
          git pull --rebase origin main
          git push origin HEAD:main
