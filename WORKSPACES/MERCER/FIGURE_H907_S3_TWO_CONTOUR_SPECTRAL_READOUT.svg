<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Source-defined two-contour vortex readout and spectral matrix</title>
<desc id="desc">A schematic cross-section showing a displaced circular core measured at two opposing contour positions, followed by the linear readout and complex spectral matrix transform. It is not experimental data or a full worldtube reconstruction.</desc>
<rect width="1200" height="675" fill="white"/>
<text x="54" y="58" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#111">Two-contour readout: geometry → channels → spectral matrix</text>
<text x="54" y="92" font-family="Arial, sans-serif" font-size="16" fill="#555">Source-defined measurement map; schematic only, not experimental data</text>

<!-- Cross-section panel -->
<rect x="45" y="125" width="500" height="470" rx="10" fill="none" stroke="#aaa" stroke-width="1.5"/>
<text x="70" y="162" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#111">1. Opposed contour positions</text>
<line x1="95" y1="375" x2="495" y2="375" stroke="#333" stroke-width="2"/>
<polygon points="495,375 484,369 484,381" fill="#333"/>
<text x="485" y="405" font-family="Arial, sans-serif" font-size="15" fill="#333">x</text>
<line x1="285" y1="210" x2="285" y2="505" stroke="#777" stroke-width="1.5" stroke-dasharray="7 6"/>
<text x="270" y="525" font-family="Arial, sans-serif" font-size="15" fill="#555">0</text>

<!-- displaced core -->
<circle cx="330" cy="375" r="92" fill="#f5f5f5" stroke="#111" stroke-width="2.5"/>
<line x1="330" y1="270" x2="330" y2="480" stroke="#777" stroke-width="1.3" stroke-dasharray="4 5"/>
<text x="338" y="266" font-family="Arial, sans-serif" font-size="15" fill="#555">core center</text>
<circle cx="238" cy="375" r="5" fill="#111"/>
<circle cx="422" cy="375" r="5" fill="#111"/>
<text x="218" y="353" font-family="Arial, sans-serif" font-size="18" fill="#111">−rπ</text>
<text x="418" y="353" font-family="Arial, sans-serif" font-size="18" fill="#111">r₀</text>

<!-- eta arrow -->
<line x1="285" y1="448" x2="330" y2="448" stroke="#111" stroke-width="2"/>
<polygon points="330,448 320,443 320,453" fill="#111"/>
<text x="294" y="472" font-family="Arial, sans-serif" font-size="16" fill="#111">η</text>

<!-- a arrow -->
<line x1="330" y1="315" x2="422" y2="315" stroke="#111" stroke-width="2"/>
<polygon points="422,315 412,310 412,320" fill="#111"/>
<text x="371" y="300" font-family="Arial, sans-serif" font-size="16" fill="#111">a</text>

<text x="70" y="555" font-family="Arial, sans-serif" font-size="17" fill="#111">η = (r₀ − rπ)/2</text>
<text x="270" y="555" font-family="Arial, sans-serif" font-size="17" fill="#111">a = (r₀ + rπ)/2</text>

<!-- Mapping panel -->
<rect x="575" y="125" width="580" height="470" rx="10" fill="none" stroke="#aaa" stroke-width="1.5"/>
<text x="600" y="162" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#111">2. Linear and spectral readout</text>
<text x="610" y="220" font-family="Arial, sans-serif" font-size="22" fill="#111">r = (r₀, rπ)ᵀ</text>
<line x1="785" y1="212" x2="850" y2="212" stroke="#333" stroke-width="2"/>
<polygon points="850,212 839,206 839,218" fill="#333"/>
<text x="870" y="200" font-family="Arial, sans-serif" font-size="18" fill="#111">y = A r</text>
<text x="870" y="230" font-family="Arial, sans-serif" font-size="16" fill="#555">y = (η, a)ᵀ</text>

<text x="610" y="290" font-family="Arial, sans-serif" font-size="18" fill="#111">A = ½ [ 1  −1 ]</text>
<text x="665" y="320" font-family="Arial, sans-serif" font-size="18" fill="#111">[ 1   1 ]</text>

<line x1="610" y1="350" x2="1120" y2="350" stroke="#bbb" stroke-width="1"/>
<text x="610" y="390" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#111">Frequency-resolved covariance</text>
<text x="610" y="430" font-family="Arial, sans-serif" font-size="22" fill="#111">Sᵧ(ω) = A Sᵣ(ω) A*</text>
<text x="610" y="478" font-family="Arial, sans-serif" font-size="18" fill="#111">Sηa = ¼(S₊₊ + S₊₋ − S₋₊ − S₋₋)</text>
<text x="610" y="520" font-family="Arial, sans-serif" font-size="15" fill="#555">The off-diagonal term retains phase-sensitive coupling.</text>
<text x="610" y="544" font-family="Arial, sans-serif" font-size="15" fill="#555">It is not determined by the two auto-spectra alone.</text>

<text x="54" y="635" font-family="Arial, sans-serif" font-size="14" fill="#555">Boundary: this 2-point readout is not a full contour, 3D core, 4D worldtube, twist field, or contact surface.</text>
</svg>