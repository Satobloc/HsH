<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
    <path d="M0,0 L7,3 L0,6" fill="none" stroke="currentColor" stroke-width="1"/>
  </marker>
</defs>
<rect width="640" height="640" fill="white"/>
<g font-family="Arial, sans-serif" fill="currentColor">
  <text x="320" y="42" text-anchor="middle" font-size="21" font-weight="bold">Bottom drain and inlet plan</text>
  <text x="320" y="72" text-anchor="middle" font-size="12">schematic only; not to scale</text>
</g>
<circle cx="320" cy="290" r="64" fill="none" stroke="currentColor" stroke-width="2"/>
<text x="320" y="282" text-anchor="middle" font-family="Arial" font-size="14" fill="currentColor">central</text>
<text x="320" y="302" text-anchor="middle" font-family="Arial" font-size="14" fill="currentColor">drain</text>
<text x="320" y="382" text-anchor="middle" font-family="Arial" font-size="12" fill="currentColor">Ø5 mm or Ø7 mm, by run</text>

<circle cx="320" cy="120" r="28" fill="none" stroke="currentColor" stroke-width="2"/>
<circle cx="490" cy="290" r="28" fill="none" stroke="currentColor" stroke-width="2"/>
<circle cx="320" cy="460" r="28" fill="none" stroke="currentColor" stroke-width="2"/>
<circle cx="150" cy="290" r="28" fill="none" stroke="currentColor" stroke-width="2"/>

<line x1="320" y1="154" x2="320" y2="214" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="456" y1="290" x2="388" y2="290" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="320" y1="426" x2="320" y2="366" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="184" y1="290" x2="252" y2="290" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>

<g font-family="Arial, sans-serif" fill="currentColor" font-size="13">
  <text x="320" y="112" text-anchor="middle">inlet 1</text>
  <text x="490" y="294" text-anchor="middle">inlet 2</text>
  <text x="320" y="465" text-anchor="middle">inlet 3</text>
  <text x="150" y="294" text-anchor="middle">inlet 4</text>
</g>
<g font-family="Arial, sans-serif" fill="currentColor" font-size="12">
  <text x="320" y="535" text-anchor="middle">Four symmetric inlets shown qualitatively.</text>
  <text x="320" y="556" text-anchor="middle">Port spacing, diameters, and pump geometry are not dimensioned.</text>
  <text x="320" y="577" text-anchor="middle">Two pumps feed the lower reservoir; not drawn.</text>
</g>
</svg>